  - name: Ningaloo Marine Park
    network: north-west
    folders:
      - ningaloo
      - {path: ningaloo_npz02, suffix: (NPZ only)}
    code: r/ningaloo
    image:
      file: images/parks/ningaloo.jpg
      caption: Guitar shark, Ningaloo Reef
      credit: Lewis Burnett
      source: https://australianmarineparks.gov.au/parks/north-west-marine-parks-network/ningaloo-marine-park/
    syntheses:
      - {label: BRUV, id: 89}
      - {label: BOSS, id: 88}

  - name: Dampier Marine Park
    network: north-west
    folders: [dampier]
    code: r/dampier
    titles:
      DampierAMP-report: Dampier Marine Park report
    image:
      file: images/parks/dampier.jpg
      caption: Adult fairy tern with a fish in its beak
      source: https://australianmarineparks.gov.au/parks/north-west-marine-parks-network/dampier-marine-park/

  - name: Beagle Marine Park
    network: south-east
    folders: [beagle]
    code: r/beagle
    image:
      file: images/parks/beagle.jpg     # save the banner photo from the source page here
      caption: Fairy prion (Pachyptila turtur)
      credit: JJ Harrison
      source: https://australianmarineparks.gov.au/parks/south-east-marine-parks-network/beagle-marine-park/
    syntheses:
      - {label: BRUV, id: 80}

  - name: Hunter Marine Park
    network: temperate-east
    folders: [hunter]
    code: r/hunter
    image:
      file: images/parks/hunter.jpg     # save the banner photo from the source page here
      caption: Yellowfin tuna
      credit: Tom Wang / Shutterstock
      source: https://australianmarineparks.gov.au/parks/temperate-east-marine-parks-network/hunter-marine-park/
